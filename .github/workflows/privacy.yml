name: Publication privacy check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # UPSTREAM actions/checkout v4.2.2; MIT; fixed SHA, no code copied.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 tests/privacy_check_test.py
      - run: python3 scripts/privacy_check.py
